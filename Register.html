<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Ram Coaching center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .box{
            border: 1px solid black;
            height: 80px;
            width: 100%;
        }
        header{
            background:  linear-gradient(60deg,white, rgb(203, 225, 244));
            height: 600px;
            width: 100%;
            /* border: 1px solid black; */
        }
        .con1{
            margin: auto;
           text-align: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .con2{
            margin: auto;
            align-items: center;
            height: 80%;
            width: 30%;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.09);
            /* border: 1px solid black; */
        }
      .student,.Phone,.target,button{
        margin-top: 15px;
        margin-bottom: 30px;
        /* border: 1px solid black; */
        margin-left: 30px;
    }
    .Edu{
        margin-bottom: 30px;
        margin-left: 30px;
        margin-top: 15px;
        /* border: 1px solid black; */
    }
    input{
        padding: 10px ;
        margin-left: 3px;
        border: 1px solid #ccc;
        outline: none;
        border-radius: 5px;
        height: 30px;
        width: 90%;
        margin-top: 10px;
    }
    input:required:invalid {
        border: 1px solid #d33;}
        input:required:valid {
            border: 1px solid #2a9d3f;}
        label{
            font-family: Arial, Helvetica, sans-serif;
            font-size: medium;
            margin-top: 100px;
        }
        select{
            height: 30px;
            width: 90%;
            margin-top: 10px;
            outline: none;
        }
        input[type="submit"]{
            text-decoration: none;
            color: #000;
        }
        input[type="submit"]:hover {
            cursor: pointer;
            transform: scale(1.1); 
        }
        input[type="submit"]{
            border-radius: 10px;
            background-color:  rgb(203, 225, 244) ;
            text-align: center;
            color: rgb(0, 0, 0);
            border-radius: 10px;
            /* border: 2px solid #4f5162; */
            height: 35px;
            width: 60%;
            margin: auto;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* background-color: white; */
            outline: none;
        }
        footer{
            margin-top: 70px;
            height: 500px;
            width: 100%;
            background-color: white;
            /* border: 2px solid black; */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box1,.box2{
            height: 100%;
            width: 50%;
            display: flex;
            justify-content: center;
            /* border: 1px solid black; */
        }
        .abcd{
            height: 90%;
            width: 50%;
            /* border: 1px solid black; */
            margin: auto;
            margin-top: 50px;
            margin-bottom: 50px;
            border-radius: 10px;
            background-color:  rgb(203, 225, 244) ;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.09);
        }
        .abcd>h2{
            margin-top: auto;
            height: 30px;
            width: 100%;
            /* border: 1px solid black; */
            text-align: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .abcd>h3{
            font-size: x-large;
            text-align: center;
            align-items: center;
            margin-bottom: 20px;
            /* height: 40%; */
            /* width: 80%; */
            margin-left: 20px;
            /* border: 1px solid black; */
            font-family: Arial, Helvetica, sans-serif;
        }
         .map{
            text-align: center;
            margin: auto;
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            /* border: 1px solid black; */
            font-family: Arial, Helvetica, sans-serif;
        }
        .abcd>a{
            margin-bottom: 5px;
            display: block;
            /* line-height: 10px; */
            font-size: medium;
            margin-left: 20px;
            color: #000;
            text-decoration: none;
            font-family: Arial, Helvetica, sans-serif;
        }
@media screen and (min-width: 1400px) {
    .con2 {
        width: 30%;
        max-width: 500px;
    }
    .abcd {
        width: 55%;
        max-width: 500px;
    }
    footer {
        gap: 20px;
    }
}
@media screen and (max-width: 1399px) {
    header {
        height: auto;
        min-height: 500px;
        padding: 20px 0;
    }
    .con2 {
        width: 40%;
        height: auto;
        min-height: 400px;
        padding: 15px;
        box-sizing: border-box;
    }
    footer {
        height: auto;
        min-height: 450px;
        gap: 15px;
    }
    .box1,.box2 {
        width: 50%;
        min-width: 0;
    }

    .abcd {
        width: 65%;
        height: auto;
        min-height: 350px;
        padding: 15px 10px;
        box-sizing: border-box;
    }

    input,
    select {
        width: 95%;
        box-sizing: border-box;
    }

    .student,
    .Phone,
    .target,
    button {
        margin-left: 10px;
    }
}
@media screen and (max-width: 1024px) {
    .box {
        height: 70px;
    }
    header {
        height: auto;
        min-height: 450px;
        padding: 25px 0;
        box-sizing: border-box;
    }
    .con1 {
        padding: 0 15px;
    }
    .con2 {
        width: 55%;
        height: auto;
        min-height: 400px;
        padding: 15px;
        box-sizing: border-box;
    }
    .student,.Phone,.target,button,.Edu {
        margin-left: 10px;
        margin-right: 10px;
    }
    input,select {
        width: 100%;
        margin-left: 0;
        box-sizing: border-box;
    }
    input[type="submit"] {
        width: 65%;
    }
    footer {
        margin-top: 35px;
        height: auto;
        min-height: 400px;
        gap: 15px;
        align-items: stretch;
    }
    .box1,.box2 {
        width: 50%;
        height: auto;
        min-width: 0;
        padding: 10px;
        box-sizing: border-box;
    }
 .abcd {
        width: 90%;
        height: auto;
        min-height: 350px;
        margin: 20px auto;
        padding: 15px 10px;
        box-sizing: border-box;
    }
 .abcd > h4 {
        font-size: medium;
        margin-left: 10px;
        overflow-wrap: anywhere;
    }
    .abcd > a {
        margin-left: 10px;
        overflow-wrap: anywhere;
    }
}
@media screen and (max-width: 768px) {
    .box {
        height: 60px;
    }
    header {
        height: auto;
        min-height: 0;
        padding: 25px 0;
    }
    .con1 {
        width: 95%;
        padding: 0 10px;
    }
    .con2 {
        width: 85%;
        max-width: 500px;
        height: auto;
        min-height: 0;
        margin: 20px auto 0;
        padding: 20px 15px;
        box-sizing: border-box;
    }
    .student,.Phone,.target,button,.Edu {
        margin: 12px 0 0;
    }
    label {
        display: inline-block;
        margin-top: 5px;
        font-size: 14px;
    }
    input,select {
        width: 100%;
        height: 40px;
        margin: 8px 0 0;
        box-sizing: border-box;
    }
    input[type="submit"] {
        width: 70%;
        height: 40px;
        margin: 20px auto 5px;
    }
    footer {
        margin-top: 25px;
        height: auto;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        padding: 10px 0;
        box-sizing: border-box;
    }
    .box1,.box2 {
        width: 95%;
        height: auto;
        min-height: 0;
        padding: 0;
    }
    .abcd {
        width: 90%;
        max-width: 500px;
        height: auto;
        min-height: 250px;
        margin: 10px auto;
        padding: 20px 15px;
        box-sizing: border-box;
    }
    .abcd > h3 {
        height: auto;
        margin-bottom: 15px;
    }
    .abcd > h4 {
        margin: 12px 0;
        font-size: 16px;
        overflow-wrap: anywhere;
    }
    .abcd > a {
        display: inline-block;
        margin: 8px 0;
        overflow-wrap: anywhere;
    }
    .abcd>map {
        display: block;
        width: 100%;
        height: 200px;
        align-items: center;
        margin: 15px auto;
        box-sizing: border-box;
    }
}
@media screen and (max-width: 480px) {
    .box {
        height: 50px;
    }
    header {
        padding: 20px 0;
    }
    .con1 {
        font-size: 14px;
    }
    .con2 {
        width: 92%;
        padding: 15px 12px;
        border-radius: 8px;
    }
    .student,.Phone,.target,button,.Edu{
        margin-top: 10px;
    }
    label{
        font-size: 13px;
    }
    input,select {
        height: 38px;
        font-size: 14px;
    }
    input[type="submit"] {
        width: 80%;
        height: 40px;
        font-size: 14px;
    }
    footer {
        margin-top: 20px;
        gap: 10px;
    }
    .box1,.box2 {
        width: 100%;
    }
    .abcd {
        width: 92%;
        min-height: 220px;
        padding: 15px 12px;
        border-radius: 8px;
    }
    .abcd > h3 {
        font-size: 17px;
    }
    .abcd > h4 {
        font-size: 14px;
        line-height: 1.5;
    }
    .abcd > a {
        font-size: 13px;
        line-height: 1.5;
    }
    .abcd > map {
        height: 180px;
    }
}
@media screen and (max-width: 319px) {
    .con2 {
        width: 96%;
        padding: 12px 8px;
    }
    label {
        font-size: 12px;
    }
    input,select {
        font-size: 12px;
    }
    input[type="submit"] {
        width: 90%;
    }
    .abcd {
        width: 96%;
        padding: 12px 8px;
    }
    .abcd > h3 {
        font-size: 15px;
    }
    .abcd > h4,.abcd > a {
        font-size: 12px;
    }
    .abcd > map {
        height: 150px;
    }
}
    </style>
</head>
